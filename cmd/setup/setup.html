<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lootnest setup</title>
<style>
:root { --ink:#141312; --panel:#1b1a18; --raised:#23211e; --line:#2f2c28; --text:#ece8e1; --muted:#a29b91; --dim:#6f6961; --bad:#e0776b; --gold:#e0a458; --gold-ink:#1a1408; --focus:#e0a458;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--ink); color:var(--text); font:14px/1.45 var(--font); user-select:none; overflow:hidden; -webkit-font-smoothing:antialiased; }
:focus { outline:none; } :focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }
.wrap { height:100%; display:grid; grid-template-rows:1fr auto; }
.main { padding:28px 36px 0; display:grid; align-content:start; gap:18px; animation:rise .24s cubic-bezier(.2,.7,.3,1); }
@keyframes rise { from { opacity:0; transform:translateY(6px); } }
.mark { width:48px; height:48px; }
h1 { font:600 26px/1.2 var(--display); margin:0; }
.sub { color:var(--muted); margin:6px 0 0; max-width:52ch; }
.opts { display:grid; gap:2px; }
.opt { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:10px 0; cursor:pointer; }
.opt input { margin:3px 0 0; width:16px; height:16px; accent-color:var(--gold); }
.opt p { margin:2px 0 0; color:var(--muted); font-size:13px; }
.where { color:var(--dim); font-size:12.5px; user-select:text; }
.foot { display:flex; gap:10px; justify-content:flex-end; align-items:center; padding:16px 36px 20px; border-top:1px solid var(--line); }
.foot .msg { margin-right:auto; color:var(--bad); font-size:13px; }
.btn { height:36px; padding:0 18px; border-radius:6px; border:1px solid var(--line); background:var(--raised); color:var(--text); font:500 14px var(--font); cursor:pointer; }
.btn:hover { background:#2a2824; }
.btn.primary { background:var(--gold); color:var(--gold-ink); border-color:var(--gold); font-weight:600; }
.btn.primary:hover { background:#ebb46c; border-color:#ebb46c; }
.btn:disabled { opacity:.5; cursor:default; }
.bar { width:100%; max-width:360px; height:3px; border-radius:3px; background:var(--line); overflow:hidden; }
.bar::after { content:""; display:block; width:40%; height:100%; border-radius:3px; background:var(--gold); animation:slide 1.2s cubic-bezier(.2,.7,.3,1) infinite; }
@keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar::after { animation:none; width:100%; } .main { animation:none; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
"use strict";
(function () {
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mark = '<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#23211e"/><path d="M7 17a9 8 0 0 0 18 0" fill="none" stroke="#e0a458" stroke-width="3.2" stroke-linecap="round"/><path d="M11.5 10.5 14 7h4l2.5 3.5L16 17z" fill="#e0a458"/></svg>';
  let info = null, step = "options", error = "";
  const opts = { desktop: true, autostart: true, launch: true };

  function render() {
    const r = document.getElementById("root");
    if (!info) { r.innerHTML = ""; return; }
    if (step === "options") {
      const update = info.existing;
      r.innerHTML = `<div class="main">${mark}
        <div><h1>${info.legacy ? "PlaySwap is now Lootnest" : update ? "Update Lootnest" : "Install Lootnest"}</h1>
        <p class="sub">${info.legacy ? `This replaces PlaySwap with Lootnest ${esc(info.version)}. Players, games, profiles, backups and the Steam set-up carry over.` : update ? `This replaces the installed Lootnest with version ${esc(info.version)}. Players, games and profiles stay as they are.` : "Everyone who shares this PC gets their own game settings and saves. Pick who's playing, and Lootnest swaps the files."}</p></div>
        <div class="opts">
          <label class="opt"><input type="checkbox" id="o-desktop" ${opts.desktop ? "checked" : ""}><span><b style="font-weight:500">Add a desktop shortcut</b></span></label>
          <label class="opt"><input type="checkbox" id="o-autostart" ${opts.autostart ? "checked" : ""}><span><b style="font-weight:500">Start with Windows</b><p>Lootnest waits in the tray and follows games you start from Steam.</p></span></label>
        </div>
        <p class="where">Installs for your Windows account in ${esc(info.installDir)}. No administrator rights needed.</p></div>
        <div class="foot"><span class="msg">${esc(error)}</span><button class="btn" data-a="cancel">Cancel</button><button class="btn primary" data-a="install">${update ? "Update" : "Install"}</button></div>`;
      setTimeout(() => { const b = document.querySelector('[data-a="install"]'); if (b) b.focus(); }, 20);
    } else if (step === "working") {
      r.innerHTML = `<div class="main">${mark}<div><h1>${info.existing ? "Updating" : "Installing"} Lootnest</h1><p class="sub">This takes a few seconds.</p></div><div class="bar"></div></div><div class="foot"></div>`;
    } else if (step === "done") {
      r.innerHTML = `<div class="main">${mark}<div><h1>Lootnest is ready</h1>
        <p class="sub">It's in your Start menu${opts.desktop ? " and on your desktop" : ""}. Add the games you share, then press Play and choose who's playing.</p></div>
        <label class="opt"><input type="checkbox" id="o-launch" ${opts.launch ? "checked" : ""}><span><b style="font-weight:500">Open Lootnest now</b></span></label></div>
        <div class="foot"><button class="btn primary" data-a="finish">Finish</button></div>`;
      setTimeout(() => { const b = document.querySelector('[data-a="finish"]'); if (b) b.focus(); }, 20);
    }
  }

  window.__setup = function (ev) {
    if (ev.type === "installed") {
      if (ev.error) { error = ev.error; step = "options"; } else { step = "done"; }
      render();
    }
  };

  document.addEventListener("change", (e) => {
    if (e.target.id === "o-desktop") opts.desktop = e.target.checked;
    if (e.target.id === "o-autostart") opts.autostart = e.target.checked;
    if (e.target.id === "o-launch") opts.launch = e.target.checked;
  });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-a]");
    if (!b) return;
    if (b.dataset.a === "cancel") window.setup_close(false);
    if (b.dataset.a === "install") { error = ""; step = "working"; render(); window.setup_install({ desktop: opts.desktop, autostart: opts.autostart }); }
    if (b.dataset.a === "finish") window.setup_close(opts.launch);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && step !== "working") window.setup_close(false);
    if ((e.ctrlKey && ["p", "f", "r"].includes(e.key.toLowerCase())) || e.key === "F5") e.preventDefault();
  }, true);

  async function boot() {
    try { info = await window.setup_info(); } catch (e) { setTimeout(boot, 120); return; }
    render();
  }
  boot();
})();
</script>
</body>
</html>
