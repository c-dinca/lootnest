<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-@NONCE@'; style-src 'unsafe-inline'; img-src data: blob: https://*.steamstatic.com https://steamcdn-a.akamaihd.net https://*.steamusercontent.com https://img.itch.zone https://*.gog-statics.com; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Lootnest</title>
<style>/*@CSS*/</style>
</head>
<body>
<div id="boot" class="boot" aria-hidden="true">
  <svg class="boot-mark" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path pathLength="1" d="M2.75 10.25c0 3.7 3.25 6.25 7.25 6.25s7.25-2.55 7.25-6.25"/><path pathLength="1" d="M5.75 10.25c0 2.2 1.9 3.5 4.25 3.5s4.25-1.3 4.25-3.5"/><circle cx="10" cy="6.25" r="2.5"/></svg>
  <span class="boot-name">Lootnest</span>
</div>
<div id="room" class="room" aria-hidden="true"><div class="room-art"></div><div class="room-veil"></div><div class="room-mesh"></div></div>
<div id="app" class="app">
  <aside class="side" id="side" aria-label="Lootnest">
    <div class="side-top">
      <div class="brand" aria-label="Lootnest">
        <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.75 10.25c0 3.7 3.25 6.25 7.25 6.25s7.25-2.55 7.25-6.25"/><path d="M5.75 10.25c0 2.2 1.9 3.5 4.25 3.5s4.25-1.3 4.25-3.5"/><circle cx="10" cy="6.25" r="2.5"/></svg>
        <span class="brand-name">Lootnest</span><span class="brand-stage" title="Lootnest is in beta">Beta</span>
      </div>
      <div class="bar-hist">
        <button class="bar-btn" id="hist-back" data-action="hist-back" aria-label="Back (Alt+Left)" title="Back (Alt+Left)" disabled><i data-ph="caret-left"></i></button>
        <button class="bar-btn" id="hist-fwd" data-action="hist-fwd" aria-label="Forward (Alt+Right)" title="Forward (Alt+Right)" disabled><i data-ph="caret-right"></i></button>
      </div>
    </div>
    <div class="bar-search" role="search">
      <label class="ln-search"><i data-ph="magnifying-glass"></i><input type="search" id="gq" class="ln-input" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Run a command, or search your games and the store (Ctrl+K)" aria-controls="gq-pop" aria-expanded="false"><kbd class="bar-kbd" aria-hidden="true">Ctrl K</kbd></label>
    </div>
    <nav class="bar-tabs" id="bar-tabs" aria-label="Sections">
      <span class="bar-ind" id="bar-ind" aria-hidden="true"></span>
      <button class="bar-tab" data-action="nav" data-view="home"><i data-ph="house" data-two></i><span class="bar-label">Home</span></button>
      <button class="bar-tab" data-action="nav" data-view="library"><i data-ph="squares-four" data-two></i><span class="bar-label">Library</span><span class="count" id="lib-count"></span></button>
      <button class="bar-tab" data-action="nav" data-view="find"><i data-ph="storefront" data-two></i><span class="bar-label">Store</span></button>
      <button class="bar-tab" data-action="nav" data-view="updates"><i data-ph="arrow-circle-up" data-two></i><span class="bar-label">Updates</span><span class="count" id="upd-count"></span></button>
      <button class="bar-tab" data-action="nav" data-view="achievements"><i data-ph="trophy" data-two></i><span class="bar-label">Achievements</span></button>
      <button class="bar-tab" data-action="nav" data-view="saves"><i data-ph="vault" data-two></i><span class="bar-label">Saves</span></button>
      <button class="bar-tab bar-more" id="bar-more" data-action="tabs-more" aria-haspopup="menu" aria-expanded="false" hidden>More</button>
    </nav>
    <div class="side-head">
      <select id="side-show" class="ln-input side-show" aria-label="Which games the list shows"></select>
      <span class="side-tools">
        <button class="side-btn" data-action="side-sort" id="side-sort" aria-label="Sort the games" title="Sort"><i data-ph="sort-ascending"></i></button>
        <button class="side-btn" data-action="add-game" aria-label="Add a game" title="Add a game"><i data-ph="plus"></i></button>
        <button class="side-btn side-collapse" data-action="side-toggle" aria-label="Fold the sidebar (Ctrl+B)" title="Fold the sidebar (Ctrl+B)"><i data-ph="sidebar-simple"></i></button>
      </span>
    </div>
    <label class="side-filter"><i data-ph="funnel"></i><input id="side-q" type="search" placeholder="Filter games" autocomplete="off" spellcheck="false" aria-label="Filter your games"></label>
    <div id="side-games" class="side-games"></div>
    <div id="side-update" class="side-update"></div>
    <div class="side-foot">
      <button class="bar-me" id="bar-me" data-action="me-menu" aria-haspopup="menu" aria-expanded="false"></button>
      <span class="side-foot-keys">
        <button class="bar-btn" data-action="nav" data-view="players" aria-label="Profiles" title="Profiles"><i data-ph="users-three"></i></button>
        <button class="bar-btn" data-action="bp-open" aria-label="Big Picture (F11)" title="Big Picture, for a controller (F11)"><i data-ph="television-simple"></i></button>
        <button class="bar-btn" data-action="nav" data-view="settings" aria-label="Settings" title="Settings"><i data-ph="gear-six" data-two></i></button>
      </span>
    </div>
    <div class="side-resize" id="side-resize" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" title="Drag to resize. Double-click to reset."></div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="overlay"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="ctx" class="ctx" role="menu" hidden></div>
<div id="gq-pop" class="gq-pop ln-root" role="listbox" aria-label="Search results" hidden></div>
<script nonce="@NONCE@">/*@JS*/</script>
</body>
</html>
