<!doctype html>
<!-- Big Picture / TV mode, the proposed direction. A static mock for the
     owner to approve; not part of the app. Open with ?s=home|game|library|settings|leave.
     Art comes from design/harness/.cache (node design/harness/fetch-art.mjs). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Big Picture mock</title>
<style>
@font-face { font-family: "Tilt Warp"; src: url("../../internal/app/ui/fonts/tilt-warp-latin.woff2") format("woff2"); }
@font-face { font-family: "Atkinson"; src: url("../../internal/app/ui/fonts/atkinson-next-latin.woff2") format("woff2"); font-weight: 200 800; }
:root {
  --u: calc(100vh / 1080);            /* one unit is a pixel at 1080p, two at 4K */
  --ground: #111217; --raised: #181a21; --key: #1f222b; --key-lit: #2a2e39;
  --fg-1: #DFE5EB; --fg-2: #a6aeb9; --fg-3: #8c94a0;
  --red: #EF233C; --green: #5FC28E; --player: #7FA8E6; --player-on: #0d1118;
  --safe-x: calc(96 * var(--u)); --safe-y: calc(54 * var(--u));
  --title: "Tilt Warp", sans-serif; --ui: "Atkinson", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--ground); color: var(--fg-1); font: 500 calc(24 * var(--u))/1.3 var(--ui); overflow: hidden; }
.s { position: fixed; inset: 0; display: none; }
body[data-s="home"] #home, body[data-s="game"] #game, body[data-s="library"] #library, body[data-s="settings"] #settings, body[data-s="leave"] #home, body[data-s="leave"] #leave { display: block; }

/* the backdrop: the focused game's art, a scrim, nothing blurred */
.bd { position: absolute; inset: 0; }
.bd img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 20%; }
.bd::after { content: ""; position: absolute; inset: 0; background:
  linear-gradient(90deg, rgb(17 18 23 / .94) 0%, rgb(17 18 23 / .72) 34%, rgb(17 18 23 / .12) 68%, rgb(17 18 23 / .2) 100%),
  linear-gradient(0deg, var(--ground) 0%, rgb(17 18 23 / .92) 22%, rgb(17 18 23 / 0) 58%),
  linear-gradient(180deg, rgb(17 18 23 / .7) 0%, rgb(17 18 23 / 0) 18%); }
.bd.dim::after { background: rgb(17 18 23 / .9); }

/* top bar */
.bar { position: absolute; left: var(--safe-x); right: var(--safe-x); top: var(--safe-y); height: calc(64 * var(--u)); display: flex; align-items: center; gap: calc(12 * var(--u)); }
.mark { width: calc(40 * var(--u)); height: calc(40 * var(--u)); color: var(--fg-1); margin-right: calc(28 * var(--u)); }
.mark circle { stroke: var(--red); }
.tab { padding: calc(14 * var(--u)) calc(26 * var(--u)); border-radius: 999px; font: 400 calc(28 * var(--u))/1 var(--title); color: var(--fg-2); }
.tab.on { color: var(--fg-1); background: rgb(255 255 255 / .12); box-shadow: inset 0 1px 0 rgb(255 255 255 / .14); }
.tab.focus { color: var(--ground); background: var(--fg-1); transform: scale(1.06); box-shadow: 0 calc(14 * var(--u)) calc(34 * var(--u)) rgb(0 0 0 / .5); }
.bar .sp { flex: 1; }
.seat { display: flex; align-items: center; gap: calc(12 * var(--u)); font-weight: 650; }
.av { display: inline-grid; place-items: center; width: calc(44 * var(--u)); height: calc(44 * var(--u)); border-radius: 50%; background: var(--player); color: var(--player-on); font: 800 calc(22 * var(--u))/1 var(--ui); }
.clock { color: var(--fg-2); font-variant-numeric: tabular-nums; margin-left: calc(20 * var(--u)); }
.gear { display: grid; place-items: center; width: calc(56 * var(--u)); height: calc(56 * var(--u)); border-radius: 50%; background: rgb(255 255 255 / .08); margin-left: calc(20 * var(--u)); }
.gear svg { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }

/* hero */
.hero { position: absolute; left: var(--safe-x); top: calc(170 * var(--u)); width: calc(1100 * var(--u)); display: grid; gap: calc(22 * var(--u)); }
.hero .logo { height: calc(170 * var(--u)); max-width: calc(560 * var(--u)); object-fit: contain; object-position: left center; filter: drop-shadow(0 calc(8 * var(--u)) calc(24 * var(--u)) rgb(0 0 0 / .6)); }
.kick { display: flex; align-items: center; gap: calc(12 * var(--u)); font: 700 calc(24 * var(--u))/1 var(--ui); color: var(--fg-1); }
.lamp { width: calc(12 * var(--u)); height: calc(12 * var(--u)); border-radius: 50%; background: var(--green); box-shadow: 0 0 calc(12 * var(--u)) var(--green); }
.facts { display: flex; flex-wrap: wrap; gap: calc(10 * var(--u)) calc(28 * var(--u)); color: var(--fg-2); font-weight: 600; }
.facts b { color: var(--fg-1); font-weight: 700; }

/* rows and tiles */
.rows { position: absolute; left: 0; right: 0; top: calc(528 * var(--u)); }
.row { margin-bottom: calc(64 * var(--u)); }
.row h2 { margin: 0 var(--safe-x) calc(34 * var(--u)); font: 400 calc(30 * var(--u))/1 var(--title); color: var(--fg-2); }
.row.on h2 { color: var(--fg-1); }
.track { display: flex; gap: calc(26 * var(--u)); padding: 0 var(--safe-x); }
.tile { position: relative; flex: none; width: calc(196 * var(--u)); }
.tile .art { display: block; aspect-ratio: 2 / 3; border-radius: calc(12 * var(--u)); overflow: hidden; background: var(--key); }
.tile .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile.focus { transform: scale(1.1); transform-origin: 50% 60%; z-index: 2; }
.tile.focus .art { box-shadow: 0 0 0 calc(3 * var(--u)) var(--ground), 0 0 0 calc(7 * var(--u)) var(--fg-1), 0 calc(30 * var(--u)) calc(60 * var(--u)) rgb(0 0 0 / .65); }
.tile .live { position: absolute; left: calc(10 * var(--u)); top: calc(10 * var(--u)); padding: calc(5 * var(--u)) calc(12 * var(--u)); border-radius: calc(8 * var(--u)); background: var(--green); color: #07140d; font: 800 calc(20 * var(--u))/1 var(--ui); }
.tile .bar2 { position: absolute; left: calc(12 * var(--u)); right: calc(12 * var(--u)); bottom: calc(12 * var(--u)); height: calc(6 * var(--u)); border-radius: 999px; background: rgb(0 0 0 / .55); overflow: hidden; }
.tile .bar2 i { display: block; height: 100%; background: var(--fg-1); }
.wide { width: calc(404 * var(--u)); }
.wide .art { aspect-ratio: 16 / 9; }
.app { width: calc(300 * var(--u)); }
.app .art { aspect-ratio: 16 / 9; display: grid; place-items: center; background: var(--key); box-shadow: inset 0 1px 0 rgb(255 255 255 / .1); font: 400 calc(30 * var(--u))/1 var(--title); }
.skel .art { background: linear-gradient(100deg, var(--key) 30%, var(--key-lit) 50%, var(--key) 70%); }

/* hint bar */
.hints { position: absolute; right: var(--safe-x); bottom: var(--safe-y); display: flex; align-items: center; gap: calc(26 * var(--u)); color: var(--fg-2); font-weight: 600; }
.hints > span { display: flex; align-items: center; gap: calc(10 * var(--u)); }
.g { display: inline-grid; place-items: center; width: calc(34 * var(--u)); height: calc(34 * var(--u)); border-radius: 50%; font: 800 calc(18 * var(--u))/1 var(--ui); background: var(--key-lit); color: var(--fg-1); }
.g.a { background: #5FC28E; color: #06140c; } .g.b { background: #F0616D; color: #1c0508; } .g.y { background: #F2C94C; color: #1b1400; }
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: calc(150 * var(--u)); background: linear-gradient(0deg, var(--ground) 30%, transparent); }

/* keys */
.keys { display: flex; gap: calc(20 * var(--u)); margin-top: calc(14 * var(--u)); }
.k { white-space: nowrap; display: inline-flex; align-items: center; gap: calc(14 * var(--u)); height: calc(76 * var(--u)); padding: 0 calc(34 * var(--u)); border-radius: calc(16 * var(--u)); background: rgb(31 34 43 / .86); box-shadow: inset 0 1px 0 rgb(255 255 255 / .13), inset 0 0 0 1px rgb(255 255 255 / .06); font: 700 calc(26 * var(--u))/1 var(--ui); }
.k.play { background: var(--player); color: var(--player-on); font: 400 calc(32 * var(--u))/1 var(--title); padding: 0 calc(44 * var(--u)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .4); }
.k.focus { transform: scale(1.06); box-shadow: inset 0 1px 0 rgb(255 255 255 / .4), 0 0 0 calc(3 * var(--u)) var(--ground), 0 0 0 calc(7 * var(--u)) var(--fg-1), 0 calc(22 * var(--u)) calc(50 * var(--u)) -8px var(--player); }
.k svg { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }

/* game page */
#game .hero { top: calc(250 * var(--u)); }
#game .rows { top: calc(700 * var(--u)); }
.ach { flex: none; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: calc(18 * var(--u)); width: calc(430 * var(--u)); padding: calc(18 * var(--u)) calc(22 * var(--u)); border-radius: calc(16 * var(--u)); background: rgb(24 26 33 / .88); box-shadow: inset 0 1px 0 rgb(255 255 255 / .08); }
.ach i { width: calc(72 * var(--u)); height: calc(72 * var(--u)); border-radius: calc(12 * var(--u)); background: linear-gradient(135deg, #3a4257, #232735); box-shadow: inset 0 0 0 calc(3 * var(--u)) var(--t, #AEB6C2); }
.ach b { display: block; font-weight: 700; }
.ach small { font-size: calc(24 * var(--u)); color: var(--fg-2); }
.ach.off { opacity: .55; }

/* library */
.chips { position: absolute; left: var(--safe-x); top: calc(160 * var(--u)); display: flex; gap: calc(14 * var(--u)); align-items: center; }
.chip { padding: calc(12 * var(--u)) calc(24 * var(--u)); border-radius: 999px; background: rgb(255 255 255 / .08); color: var(--fg-2); font-weight: 650; }
.chip.on { background: rgb(255 255 255 / .16); color: var(--fg-1); }
.count { position: absolute; right: var(--safe-x); top: calc(172 * var(--u)); color: var(--fg-2); }
.grid { position: absolute; left: var(--safe-x); right: var(--safe-x); top: calc(270 * var(--u)); display: grid; grid-template-columns: repeat(7, 1fr); gap: calc(74 * var(--u)) calc(30 * var(--u)); }
.grid .tile { width: auto; }
.name { position: absolute; left: 0; right: calc(-200 * var(--u)); top: calc(100% + 16 * var(--u)); font: 700 calc(22 * var(--u))/1.2 var(--ui); color: var(--fg-1); white-space: nowrap; }

/* settings */
.set { position: absolute; inset: calc(170 * var(--u)) var(--safe-x) calc(120 * var(--u)); display: grid; grid-template-columns: calc(420 * var(--u)) 1fr; gap: calc(64 * var(--u)); }
.set h1 { font: 400 calc(56 * var(--u))/1 var(--title); margin-bottom: calc(30 * var(--u)); }
.cat { display: flex; align-items: center; height: calc(72 * var(--u)); padding: 0 calc(26 * var(--u)); border-radius: calc(14 * var(--u)); color: var(--fg-2); font: 650 calc(26 * var(--u))/1 var(--ui); }
.cat.on { color: var(--fg-1); background: rgb(255 255 255 / .1); }
.opt { display: flex; align-items: center; justify-content: space-between; height: calc(96 * var(--u)); padding: 0 calc(32 * var(--u)); margin-bottom: calc(14 * var(--u)); border-radius: calc(16 * var(--u)); background: var(--raised); box-shadow: inset 0 1px 0 rgb(255 255 255 / .06); font: 650 calc(28 * var(--u))/1 var(--ui); }
.opt.focus { background: var(--fg-1); color: var(--ground); transform: scale(1.025); box-shadow: 0 calc(22 * var(--u)) calc(50 * var(--u)) rgb(0 0 0 / .55); }
.opt .v { display: flex; align-items: center; gap: calc(18 * var(--u)); color: var(--fg-2); font-weight: 600; }
.opt.focus .v { color: #2a2e39; }
.sw { width: calc(72 * var(--u)); height: calc(40 * var(--u)); border-radius: 999px; background: #3a3f4c; position: relative; }
.sw::after { content: ""; position: absolute; top: calc(5 * var(--u)); left: calc(5 * var(--u)); width: calc(30 * var(--u)); height: calc(30 * var(--u)); border-radius: 50%; background: var(--fg-1); }
.sw.on { background: var(--green); } .sw.on::after { left: calc(37 * var(--u)); background: #07140d; }
.say { margin: calc(26 * var(--u)) calc(8 * var(--u)) 0; color: var(--fg-2); max-width: calc(900 * var(--u)); }

/* leave */
#leave { background: rgb(11 12 16 / .78); }
.dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(760 * var(--u)); padding: calc(52 * var(--u)); border-radius: calc(24 * var(--u)); background: var(--raised); box-shadow: inset 0 1px 0 rgb(255 255 255 / .1), 0 calc(40 * var(--u)) calc(120 * var(--u)) rgb(0 0 0 / .7); }
.dlg h1 { font: 400 calc(48 * var(--u))/1.1 var(--title); margin-bottom: calc(14 * var(--u)); }
.dlg p { color: var(--fg-2); margin-bottom: calc(34 * var(--u)); }
.dlg .k { width: 100%; margin-bottom: calc(14 * var(--u)); }
.dlg .k.focus { background: var(--fg-1); color: var(--ground); box-shadow: 0 calc(18 * var(--u)) calc(40 * var(--u)) rgb(0 0 0 / .5); transform: scale(1.03); }
</style>
</head>
<body>
<script>
  const A = "../harness/.cache/";
  const mark = '<svg class="mark" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.75 10.25c0 3.7 3.25 6.25 7.25 6.25s7.25-2.55 7.25-6.25"/><path d="M5.75 10.25c0 2.2 1.9 3.5 4.25 3.5s4.25-1.3 4.25-3.5"/><circle cx="10" cy="6.25" r="2.5"/></svg>';
  const gear = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke-linecap="round"/></svg>';
  const bar = (on, focus) => `<div class="bar">${mark}${["Home", "Library", "Achievements", "Profiles"].map((t) => `<span class="tab${t === on ? " on" : ""}${t === focus ? " focus" : ""}">${t}</span>`).join("")}<span class="sp"></span><span class="seat"><span class="av">A</span>Alex</span><span class="clock">21:42</span><span class="gear">${gear}</span></div>`;
  const tile = (id, cls = "", extra = "") => `<div class="tile ${cls}"><span class="art"><img src="${A}${id}-cover.jpg"></span>${extra}</div>`;
  const hints = (list) => `<div class="hints">${list.map(([g, t]) => `<span><span class="g ${g.toLowerCase()}">${g}</span>${t}</span>`).join("")}</div>`;
  const play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const ids = [1086940, 730, 1091500, 1145350, 1551360, 271590, 367520, 1426210, 413150, 250900, 242760];
  document.body.dataset.s = new URLSearchParams(location.search).get("s") || "home";
  document.body.insertAdjacentHTML("beforeend", `
  <section class="s" id="home">
    <div class="bd"><img src="${A}1086940-hero.jpg"></div>
    ${bar("Home")}
    <div class="hero">
      <span class="kick"><span class="lamp"></span>Alex's files are loaded</span>
      <img class="logo" src="${A}1086940-logo.png" alt="Baldur's Gate 3">
      <div class="facts"><span>Played <b>5 hours ago</b></span><span><b>86 h</b> played</span><span><b>21 of 54</b> achievements</span><span><b>3</b> save points</span></div>
    </div>
    <div class="rows">
      <section class="row on"><h2>Continue playing</h2><div class="track">
        ${tile(1086940, "focus", '<span class="bar2"><i style="width:39%"></i></span>')}${tile(730, "", '<span class="live">Playing</span>')}${tile(1426210)}${tile(1145350)}${tile(1091500)}${tile(367520)}${tile(413150)}${tile(1551360)}${tile(271590)}
      </div></section>
      <section class="row"><h2>Apps</h2><div class="track"><div class="tile app"><span class="art">Spotify</span></div><div class="tile app"><span class="art">YouTube</span></div><div class="tile app"><span class="art">Stremio</span></div></div></section>
    </div>
    <div class="fade"></div>
    ${hints([["A", "Open"], ["Y", "Play as someone else"], ["B", "Back"]])}
  </section>

  <section class="s" id="game">
    <div class="bd"><img src="${A}1145350-hero.jpg" style="object-position:60% 15%"></div>
    ${bar("Library")}
    <div class="hero">
      <img class="logo" src="${A}1145350-logo.png" alt="Hades II">
      <div class="facts"><span>Steam</span><span>Played <b>yesterday</b></span><span><b>41 h</b> played</span><span>Plays well with a controller</span></div>
      <div class="keys"><span class="k play focus">${play}Play as Alex</span><span class="k">Play as someone else</span><span class="k">Save points</span></div>
    </div>
    <div class="rows">
      <section class="row"><h2>Achievements, 18 of 49</h2><div class="track">
        <div class="ach" style="--t:#F2C94C"><i></i><span><b>Night's champion</b><small>2.1% of players</small></span></div>
        <div class="ach" style="--t:#B48CF2"><i></i><span><b>Chaos reborn</b><small>8.4% of players</small></span></div>
        <div class="ach" style="--t:#5FC28E"><i></i><span><b>First of many</b><small>31% of players</small></span></div>
        <div class="ach off"><i></i><span><b>Witch's brew</b><small>Not unlocked yet</small></span></div>
        <div class="ach off"><i></i><span><b>Hidden</b><small>Not unlocked yet</small></span></div>
      </div></section>
    </div>
    <div class="fade"></div>
    ${hints([["A", "Play"], ["Y", "Play as someone else"], ["B", "Back"]])}
  </section>

  <section class="s" id="library">
    <div class="bd dim"><img src="${A}1091500-hero.jpg"></div>
    ${bar("Library")}
    <div class="chips"><span class="chip on">All games</span><span class="chip">Favourites</span><span class="chip">Co-op</span><span class="chip">Weekend</span><span class="chip">For the kids</span><span class="chip">Recently played</span></div>
    <span class="count">14 games</span>
    <div class="grid">
      ${ids.slice(0, 7).map((id, i) => tile(id, i === 2 ? "focus" : "", i === 2 ? '<span class="name">Cyberpunk 2077</span>' : "")).join("")}
      ${ids.slice(7).map((id) => tile(id)).join("")}<div class="tile skel"><span class="art"></span></div><div class="tile skel"><span class="art"></span></div><div class="tile skel"><span class="art"></span></div>
    </div>
    <div class="fade"></div>
    ${hints([["A", "Open"], ["Y", "Play as someone else"], ["B", "Back"]])}
  </section>

  <section class="s" id="settings">
    <div class="bd dim"><img src="${A}1086940-hero.jpg"></div>
    ${bar("")}
    <div class="set">
      <div><h1>Settings</h1>
        <div class="cat">Sound</div><div class="cat on">Picture and motion</div><div class="cat">Controller</div><div class="cat">Profiles</div><div class="cat">TV mode</div><div class="cat">About</div></div>
      <div style="padding-top: calc(86 * var(--u))">
        <div class="opt focus">Motion<span class="v">&#9664;&nbsp; Full &nbsp;&#9654;</span></div>
        <div class="opt">The game in focus behind the screen<span class="v">On<span class="sw on"></span></span></div>
        <div class="opt">Trailers behind the game in focus<span class="v">Off<span class="sw"></span></span></div>
        <div class="opt">Open in Big Picture when Lootnest starts<span class="v">Off<span class="sw"></span></span></div>
        <p class="say">Full moves and fades everything. Less keeps only fades. Off changes screens at once.</p>
      </div>
    </div>
    ${hints([["A", "Change"], ["B", "Back"]])}
  </section>

  <section class="s" id="leave">
    <div class="dlg"><h1>Leave TV mode?</h1><p>The stream to the TV ends. Lootnest stays open on the PC.</p>
      <span class="k focus">Stay</span><span class="k">Switch profile</span><span class="k">Leave TV mode</span></div>
  </section>`);
</script>
</body>
</html>
