<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lootnest</title>
<style>/*@CSS*/</style>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand" aria-label="Lootnest">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="ln-mark" x1="0" x2="1"><stop offset="0" style="stop-color:var(--p1)"/><stop offset="1" style="stop-color:var(--p2)"/></linearGradient></defs><path d="M5.5 15.5a10.5 9.5 0 0 0 21 0" fill="none" stroke="url(#ln-mark)" stroke-width="3.4"/><path d="M10 9.5 13 5h6l3 4.5L16 18z" fill="url(#ln-mark)" opacity=".85"/><path d="M10 9.5 13 5h6l3 4.5z" fill="#fff" opacity=".45"/></svg>
      <span>Lootnest</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-action="nav" data-view="games">Games</button>
      <button class="tab" role="tab" data-action="nav" data-view="players">Players</button>
      <button class="tab" role="tab" data-action="nav" data-view="settings">Settings</button>
    </nav>
    <div id="now" class="now" aria-live="polite"></div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="overlay"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>/*@JS*/</script>
</body>
</html>
