name: Build

# Every push and pull request: run the tests and build both .exe files.
# A push to main whose VERSION has no release yet publishes that release,
# with the version's CHANGELOG section as its notes (so a release is: bump
# VERSION, rename "## Unreleased" to "## <version>", merge).
# A pushed tag like v1.2.0 also publishes a release with the .exe files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tests on Windows itself: NTFS, files a game holds open, read-only
  # saves, long paths, the note over a game, hot keys, running as
  # administrator and Windows Firewall. A release is only made when they pass.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test on Windows
        shell: bash
        run: |
          go version
          go test -count=1 ./internal/core/ ./internal/win/
          go vet ./internal/app
          go build -o lootnest-test.exe ./cmd/lootnest

  build:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # SignPath fetches the uploaded .exe through the Actions API
    outputs:
      # The tag of the release this run published, if any (for winget below).
      release: ${{ steps.newver.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Known vulnerabilities in Go or the code Lootnest uses fail the build,
      # Windows code included. go.mod's toolchain line picks the Go release.
      - name: Check for known vulnerabilities
        run: |
          go version
          # Built with the same Go as Lootnest: an older one can't read its stdlib.
          GOTOOLCHAIN="$(go env GOVERSION)" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./internal/core/...

      - name: Is VERSION a new release?
        id: newver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released"
            exit 0
          fi
          awk -v h="## $v" '$0 == h { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::VERSION is $v but CHANGELOG.md has no '## $v' section to use as release notes"
            exit 1
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Lootnest.exe
        run: ./build.sh app

      # Code signing by SignPath Foundation, off until the repository
      # variable SIGNPATH_ENABLED is 'true' (docs/RELEASING.md). Only builds
      # that become a release are signed, never pull requests. The app is
      # signed before it goes into the setup, then the setup itself.
      - name: Upload Lootnest.exe for signing
        id: unsigned-app
        if: vars.SIGNPATH_ENABLED == 'true' && (steps.newver.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/Lootnest.exe

      - name: Sign Lootnest.exe
        if: steps.unsigned-app.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # time to approve the request
          output-artifact-directory: signed/app

      - name: Use the signed Lootnest.exe
        if: steps.unsigned-app.outcome == 'success'
        run: cp signed/app/Lootnest.exe dist/Lootnest.exe

      - name: Build Lootnest-Setup.exe
        run: ./build.sh setup

      - name: Upload Lootnest-Setup.exe for signing
        id: unsigned-setup
        if: steps.unsigned-app.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/Lootnest-Setup.exe

      - name: Sign Lootnest-Setup.exe
        if: steps.unsigned-setup.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # time to approve the request
          output-artifact-directory: signed/setup

      - name: Use the signed Lootnest-Setup.exe
        if: steps.unsigned-setup.outcome == 'success'
        run: cp signed/setup/Lootnest-Setup.exe dist/Lootnest-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Lootnest
          path: |
            dist/Lootnest-Setup.exe
            dist/Lootnest.exe

      - name: Publish the new version
        if: steps.newver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.newver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lootnest ${{ steps.newver.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/Lootnest-Setup.exe
            dist/Lootnest.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lootnest-Setup.exe
            dist/Lootnest.exe
          generate_release_notes: true

  # Sends the new release to winget (a pull request to microsoft/winget-pkgs),
  # off until the repository variable WINGET_ENABLED is 'true'; the first
  # version goes in by hand from packaging/winget (docs/RELEASING.md). A job
  # here, not "on: release": a release made with GITHUB_TOKEN starts no
  # other workflow.
  winget:
    needs: build
    if: vars.WINGET_ENABLED == 'true' && needs.build.outputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: CDinca.Lootnest
          installers-regex: 'Lootnest-Setup\.exe$'
          release-tag: ${{ needs.build.outputs.release }}
          token: ${{ secrets.WINGET_TOKEN }}
