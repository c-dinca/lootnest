ShortDescription: Every game on your PC in one library, with saves, settings and achievements kept per profile.
Description: |-
  Lootnest puts the games from every store and folder on your PC in one library.
  Each profile, a person or a run of a game, has its own saves, settings and achievements,
  and Lootnest swaps the right files into place before a game starts, with a copy made first.
  It works offline, needs no account, and sends nothing unless you turn a feature on.
