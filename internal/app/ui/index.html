<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-@NONCE@'; style-src 'unsafe-inline'; img-src data: https://*.steamstatic.com https://steamcdn-a.akamaihd.net https://*.steamusercontent.com; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Lootnest</title>
<style>/*@CSS*/</style>
</head>
<body>
<div id="boot" class="boot" aria-hidden="true">
  <svg class="boot-mark" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path pathLength="1" d="M2.75 10.25c0 3.7 3.25 6.25 7.25 6.25s7.25-2.55 7.25-6.25"/><path pathLength="1" d="M5.75 10.25c0 2.2 1.9 3.5 4.25 3.5s4.25-1.3 4.25-3.5"/><circle cx="10" cy="6.25" r="2.5"/></svg>
  <span class="boot-name">Lootnest</span>
</div>
<div id="backdrop" aria-hidden="true"><div class="bd"></div><div class="bd"></div></div>
<div id="app" class="app">
  <aside class="side" id="side">
    <div class="side-top">
      <div class="brand" aria-label="Lootnest">
        <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.75 10.25c0 3.7 3.25 6.25 7.25 6.25s7.25-2.55 7.25-6.25"/><path d="M5.75 10.25c0 2.2 1.9 3.5 4.25 3.5s4.25-1.3 4.25-3.5"/><circle cx="10" cy="6.25" r="2.5"/></svg>
        <span class="brand-name">Lootnest</span><span class="brand-stage" title="Lootnest is in beta">Beta</span>
      </div>
      <button class="side-btn side-bp" data-action="bp-open" aria-label="Big Picture (F11)" title="Big Picture, for a controller (F11)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 6.5h7a4 4 0 0 1 3.9 4.9l-.6 2.6a2 2 0 0 1-3.4.9L11.6 13H8.4l-1.8 1.9a2 2 0 0 1-3.4-.9l-.6-2.6A4 4 0 0 1 6.5 6.5z"/><path d="M6.5 9v2.5M5.25 10.25h2.5M13 9.75h.01M14.75 11.25h.01"/></svg></button>
      <button class="side-btn side-collapse" data-action="side-toggle" aria-label="Collapse the sidebar (Ctrl+B)" title="Collapse the sidebar (Ctrl+B)"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12M12.5 8.25 10.75 10l1.75 1.75"/></svg></button>
    </div>
    <div class="side-search" role="search">
      <label class="ln-search"><svg class="ln-icon" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8.75" cy="8.75" r="4.75"/><path d="M12.25 12.25 16 16"/></svg><input type="search" id="gq" class="ln-input" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search your games and the store (Ctrl+K)" aria-controls="gq-pop" aria-expanded="false"><kbd class="side-kbd" aria-hidden="true">Ctrl K</kbd></label>
      <div id="gq-pop" class="gq-pop ln-root" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <nav class="nav-list" aria-label="Sections">
      <button class="nav" data-action="nav" data-view="home" title="Home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span class="nav-label">Home</span></button>
      <button class="nav" data-action="nav" data-view="library" title="Library"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg><span class="nav-label">Library</span><span class="count" id="lib-count"></span></button>
      <button class="nav" data-action="nav" data-view="find" title="Store"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5.5 5.5"/></svg><span class="nav-label">Store</span></button>
      <button class="nav" data-action="nav" data-view="updates" title="Updates"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/><path d="M12 8v4.5l3 1.75"/></svg><span class="nav-label">Updates</span><span class="count" id="upd-count"></span></button>
      <button class="nav" data-action="nav" data-view="achievements" title="Achievements"><svg viewBox="0 0 24 24"><path d="M8 4h8v5.5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5a3 3 0 0 0 3 3M16 6h3v1.5a3 3 0 0 1-3 3M12 13.5v3M8.5 20h7"/></svg><span class="nav-label">Achievements</span></button>
      <button class="nav" data-action="nav" data-view="cloud" title="Cloud saves"><svg viewBox="0 0 24 24"><path d="M7 18h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.5 9.2 4.5 4.5 0 0 0 7 18z"/><path d="M12 11v5M9.5 13.5 12 16l2.5-2.5"/></svg><span class="nav-label">Cloud saves</span></button>
      <button class="nav" data-action="nav" data-view="players" title="Profiles"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.8-3.5 3.2-5.5 6-5.5s5.2 2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.6.3 4.3 2.2 5 5"/></svg><span class="nav-label">Profiles</span></button>
    </nav>
    <section class="side-lib" aria-label="Your games">
      <div class="side-lib-head">
        <span class="side-label">Games</span>
        <span class="side-lib-tools">
          <button class="side-btn" data-action="side-sort" id="side-sort" aria-label="Sort the games" title="Sort"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4v12M3.5 13.5 6 16l2.5-2.5M14 16V4M11.5 6.5 14 4l2.5 2.5"/></svg></button>
          <button class="side-btn" data-action="add-game" aria-label="Add a game" title="Add a game"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg></button>
        </span>
      </div>
      <label class="side-filter"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5h13M6 10h8M8.5 15h3"/></svg><input id="side-q" type="search" placeholder="Filter games" autocomplete="off" spellcheck="false" aria-label="Filter your games"></label>
      <div id="side-games" class="side-games"></div>
    </section>
    <div class="side-foot">
      <div id="who-head" class="side-label who-head"><span>Who's here</span></div>
      <div id="who" class="who-list" aria-live="polite"></div>
      <div id="side-update" class="side-update"></div>
      <button class="nav nav-bottom" data-action="nav" data-view="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span class="nav-label">Settings</span></button>
    </div>
    <div class="side-resize" id="side-resize" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" title="Drag to resize. Double-click to reset."></div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="overlay"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="ctx" class="ctx" role="menu" hidden></div>
<script nonce="@NONCE@">/*@JS*/</script>
</body>
</html>
