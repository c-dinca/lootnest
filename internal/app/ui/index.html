<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-@NONCE@'; style-src 'unsafe-inline'; img-src data: https://*.steamstatic.com https://steamcdn-a.akamaihd.net https://*.steamusercontent.com; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Lootnest</title>
<style>/*@CSS*/</style>
</head>
<body>
<div id="backdrop" aria-hidden="true"><div class="bd"></div><div class="bd"></div></div>
<div id="app" class="app">
  <aside class="side">
    <div class="brand" aria-label="Lootnest">
      <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.75 10.25c0 3.7 3.25 6.25 7.25 6.25s7.25-2.55 7.25-6.25"/><path d="M5.75 10.25c0 2.2 1.9 3.5 4.25 3.5s4.25-1.3 4.25-3.5"/><circle cx="10" cy="6.25" r="2.5"/></svg>
      <span>Lootnest</span>
    </div>
    <div class="side-search" role="search">
      <label class="ln-search"><svg class="ln-icon" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8.75" cy="8.75" r="4.75"/><path d="M12.25 12.25 16 16"/></svg><input type="search" id="gq" class="ln-input" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search your games and the store (Ctrl+K)" aria-controls="gq-pop" aria-expanded="false"></label>
      <div id="gq-pop" class="gq-pop ln-root" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <nav class="nav-list" aria-label="Sections">
      <button class="nav" data-action="nav" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button class="nav" data-action="nav" data-view="library"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg>Library<span class="count" id="lib-count"></span></button>
      <button class="nav" data-action="nav" data-view="find"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5.5 5.5"/></svg>Store</button>
      <button class="nav" data-action="nav" data-view="achievements"><svg viewBox="0 0 24 24"><path d="M8 4h8v5.5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5a3 3 0 0 0 3 3M16 6h3v1.5a3 3 0 0 1-3 3M12 13.5v3M8.5 20h7"/></svg>Achievements</button>
      <button class="nav" data-action="nav" data-view="cloud"><svg viewBox="0 0 24 24"><path d="M7 18h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.5 9.2 4.5 4.5 0 0 0 7 18z"/><path d="M12 11v5M9.5 13.5 12 16l2.5-2.5"/></svg>Cloud saves</button>
      <button class="nav" data-action="nav" data-view="players"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.8-3.5 3.2-5.5 6-5.5s5.2 2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.6.3 4.3 2.2 5 5"/></svg>Profiles</button>
    </nav>
    <div class="side-sep"></div>
    <div id="who-head" class="side-label who-head"><span>Who's here</span></div>
    <div id="who" class="who-list" aria-live="polite"></div>
    <div id="side-update" class="side-update"></div>
    <button class="nav nav-bottom" data-action="nav" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="overlay"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="ctx" class="ctx" role="menu" hidden></div>
<script nonce="@NONCE@">/*@JS*/</script>
</body>
</html>
